<title>ফরিদপুর উচ্চ বিদ্যালয় – ১৭৫ বছর পূর্তি ফটো ফ্রেম</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Galada&family=Rammetto+One&family=Emilys+Candy&family=Sniglet&display=swap" rel="stylesheet">
<style>
:root{--bg:#13113a;--fg:#f8f2dc;--gold:#f7d57a;--accent:#d04f2a;--card:#1f1c5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Hind Siliguri',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 16px 56px}
main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:16px}
#out{width:100%;aspect-ratio:1;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.2);background:var(--card)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
button,.btn{display:inline-block;text-align:center;font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 24px;cursor:pointer;background:var(--accent);color:#fff;font-size:1rem}
.alt{background:transparent;color:var(--fg);border:2px solid var(--fg)}
#dl{display:none}
#modal{position:fixed;inset:0;background:rgba(10,8,40,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
.box{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px;align-items:center}
#cv{width:100%;aspect-ratio:1;border-radius:8px;touch-action:none;cursor:grab;background:#000}
input[type=range]{width:100%;accent-color:var(--accent)}
small{opacity:.75;text-align:center}
h1{font-family:'Galada','Hind Siliguri',sans-serif;font-weight:400;color:var(--gold);font-size:clamp(2rem,9vw,3rem);line-height:1.15;margin:0;text-align:center}
.sub{font-family:'Galada','Hind Siliguri',sans-serif;color:var(--gold);font-size:clamp(1.3rem,6vw,2rem);margin:-8px 0 0;text-align:center}
#cw{display:none;text-align:center;margin-top:8px}
#cnt{font-family:'Rammetto One',sans-serif;color:var(--accent);font-size:clamp(3rem,16vw,4.5rem);line-height:1}
.lbl{font-family:'Emilys Candy','Hind Siliguri',cursive;color:var(--accent);font-size:1.5rem;margin-top:4px}
.by{font-family:'Sniglet','Hind Siliguri',sans-serif;color:var(--gold);font-size:1rem;position:fixed;left:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));opacity:.9}
.by a{color:var(--gold);text-decoration:underline}
</style>
</head>

const HOLE={x:959.5,y:956,r:613};
const out=document.getElementById('out'),octx=out.getContext('2d');
const frame=new Image();
let userPhoto=null;
function render(){
  octx.clearRect(0,0,1920,1920);
  octx.fillStyle='#fff';
  if(userPhoto){
    octx.save();
    octx.beginPath();octx.arc(HOLE.x,HOLE.y,HOLE.r+6,0,Math.PI*2);octx.clip();
    const s=(HOLE.r+6)*2;
    octx.drawImage(userPhoto,HOLE.x-s/2,HOLE.y-s/2,s,s);
    octx.restore();
  }else{
    octx.beginPath();octx.arc(HOLE.x,HOLE.y,HOLE.r,0,Math.PI*2);octx.fillStyle='#ececec';octx.fill();
  }
  octx.drawImage(frame,0,0,1920,1920);

const file=document.getElementById('file'),modal=document.getElementById('modal');

const S=640;

  iw=img.width;ih=img.height;base=Math.min(iw,ih);cx=iw/2;cy=ih/2;z=1;zoom.value=1;
  modal.classList.add('on');draw();file.value='';
};
function clamp(){const v=base/z;cx=Math.min(Math.max(cx,v/2),iw-v/2);cy=Math.min(Math.max(cy,v/2),ih-v/2);}
function draw(){
  clamp();const v=base/z;
  ctx.clearRect(0,0,S,S);
  ctx.drawImage(img,cx-v/2,cy-v/2,v,v,0,0,S,S);
  ctx.save();ctx.fillStyle='rgba(10,8,40,.6)';

cv.onpointermove=e=>{
  if(!pts.has(e.pointerId))return;
  const p=pts.get(e.pointerId),k=(base/z)/cv.getBoundingClientRect().width;
  if(pts.size===1){cx-=(e.clientX-p[0])*k;cy-=(e.clientY-p[1])*k;}
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){
    const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(lastD)z=Math.min(4,Math.max(1,z*d/lastD));lastD=d;zoom.value=z;
  }
  draw();
};
cv.onpointerup=cv.onpointercancel=e=>{pts.delete(e.pointerId);lastD=0;};
cv.onwheel=e=>{e.preventDefault();z=Math.min(4,Math.max(1,z*(e.deltaY<0?1.08:1/1.08)));zoom.value=z;draw();};
document.getElementById('cancel').onclick=()=>modal.classList.remove('on');
document.getElementById('ok').onclick=()=>{
  const v=base/z,c=document.createElement('canvas');c.width=c.height=1300;
  c.getContext('2d').drawImage(img,cx-v/2,cy-v/2,v,v,0,0,1300,1300);
  userPhoto=c;modal.classList.remove('on');render();
  document.getElementById('dl').style.display='inline-block';
  document.getElementById('up').textContent='অন্য ছবি দিন';
  document.getElementById('up').classList.add('alt');
};
document.getElementById('dl').onclick=()=>{
  out.toBlob(async b=>{
    const name='faridpur-high-school-175.png';
    let dls=null;
    try{dls=await claude.use('downloads');}catch(e){}
    if(dls){
      try{await dls.save({filename:name,data:b});bump();return;}
      catch(e){if(e&&e.code==='declined')return;}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
    document.body.appendChild(a);a.click();a.remove();bump();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  },'image/png');
};
let dbc=null,count=null;
const cnt=document.getElementById('cnt'),cw=document.getElementById('cw');
function showCount(n){cnt.textContent=String(n).padStart(3,'0');cw.style.display='block';}
(async()=>{try{const db=await claude.use('db');if(!db)return;dbc=db.collection('downloads');const s=await dbc.get();count=s.size;showCount(count);}catch(e){}})();
async function bump(){if(!dbc||count===null)return;try{await dbc.add({t:Date.now()});count++;showCount(count);}catch(e){}}
</script>
