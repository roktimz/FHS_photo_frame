<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ফরিদপুর উচ্চ বিদ্যালয় – ১৭৫ বছর পূর্তি ফটো ফ্রেম</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Galada&display=swap" rel="stylesheet">
<style>
:root{--bg:#13113a;--fg:#f8f2dc;--gold:#f7d57a;--accent:#d04f2a;--card:#1f1c5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Hind Siliguri',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:16px}
#out{width:100%;aspect-ratio:1;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.2);background:var(--card)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
button,.btn{display:inline-block;text-align:center;font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 24px;cursor:pointer;background:var(--accent);color:#fff;font-size:1rem}
.alt{background:transparent;color:var(--fg);border:2px solid var(--fg)}
#dl{display:none}
#modal{position:fixed;inset:0;background:rgba(10,8,40,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
.box{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px;align-items:center}
#cv{width:100%;aspect-ratio:1;border-radius:8px;touch-action:none;cursor:grab;background:#000}
input[type=range]{width:100%;accent-color:var(--accent)}
small{opacity:.75;text-align:center}
#msg{min-height:1.2em;text-align:center;font-size:.95rem;color:var(--gold)}
h1{font-family:'Galada','Hind Siliguri',sans-serif;font-weight:400;color:var(--gold);font-size:clamp(2rem,9vw,3rem);line-height:1.15;margin:0;text-align:center}
.sub{font-family:'Galada','Hind Siliguri',sans-serif;color:var(--gold);font-size:clamp(1.3rem,6vw,2rem);margin:-8px 0 0;text-align:center}
</style>
</head>
<body>
<main>
<h1>ফরিদপুর উচ্চ বিদ্যালয়</h1>
<p class="sub">স্থাপিত : ১৮৫১</p>
<canvas id="out" width="1920" height="1920"></canvas>
<div class="row">
<label id="up" class="btn" for="file">ছবি আপলোড করুন</label>
<button id="dl">ডাউনলোড</button>
</div>
<div id="msg"></div>
<input type="file" id="file" accept="image/*">
</main>

<div id="modal"><div class="box">
<canvas id="cv" width="640" height="640"></canvas>
<input type="range" id="zoom" min="0.64" max="4" step="0.01" value="1" aria-label="জুম">
<small>ছবি টেনে সরান, জুম করে সঠিক অংশ বেছে নিন</small>
<div class="row"><button class="alt" id="cancel">বাতিল</button><button id="ok">ঠিক আছে</button></div>
</div></div>

const $=id=>document.getElementById(id);
const out=$('out'),octx=out.getContext('2d'),cv=$('cv'),cctx=cv.getContext('2d');
const frame=new Image();let photo=null,cropped=null;
let scale=1,base=1,ox=0,oy=0;
function drawOut(){
  octx.clearRect(0,0,1920,1920);
  octx.fillStyle='#ffffff';octx.fillRect(0,0,1920,1920);
  if(cropped)octx.drawImage(cropped,0,0,1920,1920);
  if(frame.complete&&frame.naturalWidth)octx.drawImage(frame,0,0,1920,1920);
}
frame.onload=drawOut;frame.src=FRAME_SRC;
function clamp(){
  const w=photo.width*base*scale,h=photo.height*base*scale;
  ox=Math.min(116,Math.max(524-w,ox));oy=Math.min(116,Math.max(524-h,oy));
}
function drawCv(){
  cctx.fillStyle='#fff';cctx.fillRect(0,0,640,640);
  cctx.drawImage(photo,ox,oy,photo.width*base*scale,photo.height*base*scale);
  // guide circle
  cctx.save();cctx.fillStyle='rgba(0,0,0,.45)';cctx.beginPath();cctx.rect(0,0,640,640);
  cctx.arc(320,320,204,0,Math.PI*2,true);cctx.fill('evenodd');cctx.restore();
  cctx.strokeStyle='rgba(255,255,255,.8)';cctx.lineWidth=2;cctx.beginPath();cctx.arc(320,320,204,0,Math.PI*2);cctx.stroke();
}
$('file').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const img=new Image();const url=URL.createObjectURL(f);
  img.onload=()=>{
    photo=img;base=640/Math.min(img.width,img.height);scale=1;
    ox=(640-img.width*base)/2;oy=(640-img.height*base)/2;
    $('zoom').value=1;$('modal').classList.add('on');drawCv();
  };
  img.src=url;e.target.value='';
});
$('zoom').addEventListener('input',e=>{
  const ns=parseFloat(e.target.value);
  const cx=(320-ox)/(base*scale),cy=(320-oy)/(base*scale);
  scale=ns;ox=320-cx*base*scale;oy=320-cy*base*scale;clamp();drawCv();
});
let drag=false,lx=0,ly=0;
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*640/r.height]}
cv.addEventListener('pointerdown',e=>{drag=true;[lx,ly]=pt(e);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const[x,y]=pt(e);ox+=x-lx;oy+=y-ly;lx=x;ly=y;clamp();drawCv()});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drag=false));
$('cancel').onclick=()=>$('modal').classList.remove('on');
$('ok').onclick=()=>{
  const c=document.createElement('canvas');c.width=c.height=1920;
  const k=1920/640;
  c.getContext('2d').drawImage(photo,ox*k,oy*k,photo.width*base*scale*k,photo.height*base*scale*k);
  cropped=c;drawOut();$('modal').classList.remove('on');$('dl').style.display='inline-block';$('up').textContent='ছবি পরিবর্তন করুন';
};
$('dl').onclick=async()=>{
  const m=$('msg');m.textContent='';
  const blob=await new Promise(r=>out.toBlob(r,'image/png'));
  try{
    const d=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads'):null;
    if(d){await d.save({filename:'faridpur-high-school-175.png',data:blob});}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='faridpur-high-school-175.png';document.body.appendChild(a);a.click();a.remove();}
    m.textContent='ডাউনলোড হয়েছে ✓';
  }catch(err){
    if(err&&err.code==='declined')return;
    m.textContent='ডাউনলোড করা যায়নি, আবার চেষ্টা করুন।';
  }
};
</script>
